    --bg: #121212;
    --panel: #1a1a1a;
    --panel-2: #232323;
    --border: #333333;
    --text: #f2f2f2;
    --muted: #8e8e8e;
    --accent: #4da3ff;
    --accent-ink: var(--accent);   /* accent used for text/links (darkened in light mode) */
    --on-accent: #06101c;          /* text color on top of accent-filled buttons */
  }
  :root[data-site-theme="light"] {
    color-scheme: light;
    --bg: #eef1f6; --panel: #ffffff; --panel-2: #f1f4f9; --border: #d6dce8;
    --text: #171b26; --muted: #596175;
    --accent-ink: color-mix(in srgb, var(--accent) 58%, #000);
  }
  .theming, .theming * { transition: background-color .3s, color .3s, border-color .3s, box-shadow .3s !important; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font-family: inherit; }
  a { color: var(--accent-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .bar { max-width: 1200px; margin: 0 auto; min-height: 56px; padding-block: 6px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         display: flex; align-items: center; flex-wrap: wrap; gap: 4px 24px; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand span { color: var(--accent-ink); }
  .logo { display: inline-block; width: 26px; height: 26px; margin-right: 9px; vertical-align: -6px; background: var(--text);
          -webkit-mask: var(--logo-mask) center / contain no-repeat; mask: var(--logo-mask) center / contain no-repeat; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 600; }
  nav a:hover { background: var(--panel-2); text-decoration: none; color: var(--text); }
  nav a.active { color: var(--text); background: var(--panel-2); }

  main { max-width: 1200px; margin: 0 auto; padding-block: 24px 64px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 20px; }

  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  input.search { width: 100%; padding: 10px 14px; margin-bottom: 12px; border-radius: 10px;
                 border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 15px; }
  input.search:focus { outline: 2px solid var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }

  /* list rows */
  .row { display: flex; gap: 14px; align-items: center; padding: 10px 14px;
         border: 1px solid var(--border); background: var(--panel); border-radius: 12px;
         margin-bottom: 8px; cursor: pointer; transition: .12s; }
  .row:hover { border-color: var(--accent); }
  .row.selected { border-color: var(--accent); background: var(--panel-2); }
  .rank { font-size: 20px; font-weight: 800; min-width: 44px; text-align: center; color: var(--text); }
  .rank.top { color: var(--accent-ink); }   /* ranks 1-3 (see TOP_COUNT in the script) */
  .thumb { width: 128px; height: 72px; border-radius: 8px; background: var(--panel-2) center/cover;
           flex: none; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .info { flex: 1; min-width: 0; }
  .lname { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lname .ltxt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbadge { display: inline-flex; flex: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); align-items: center; justify-content: center;
            box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 55%, transparent); }
  .vbadge { color: var(--on-accent); }
  .vbadge svg { width: 11px; height: 11px; }
  .detail h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 13px; }
  .pts { color: var(--accent-ink); font-weight: 700; white-space: nowrap; }
  @media (max-width: 520px) { .thumb { display: none; } }

  /* detail panel */
  .detail { position: sticky; top: 76px; padding: 18px; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; }
  .video { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: 10px; background: var(--panel-2); margin: 12px 0; }
  .novideo { aspect-ratio: 16/9; display: grid; place-items: center; background: var(--panel-2);
             border-radius: 10px; color: var(--muted); margin: 12px 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; word-break: break-word; }
  .detail h3 { margin: 16px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .victors { margin: 0; padding: 0; list-style: none; max-height: 220px; overflow: auto; }
  .victors li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .empty { color: var(--muted); font-style: italic; }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-weight: 800; color: var(--muted); width: 60px; }

  /* text pages */
  .prose { padding: 22px; }
  .prose h2 { margin-top: 0; }
  .prose ul { padding-left: 20px; }
  .prose li { margin: 6px 0; }

  /* player links + profiles */
  a.plink { color: inherit; }
  a.plink:hover { color: var(--accent-ink); text-decoration: underline; }
  td a.plink { font-weight: 700; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); font-weight: 600; }
  .back:hover { color: var(--text); text-decoration: none; }
  .profile-head { display: flex; gap: 20px; align-items: center; padding: 22px; margin-bottom: 16px; flex-wrap: wrap; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
            font-size: 36px; font-weight: 800; color: #fff; border: 3px solid var(--accent);
            background-size: cover; background-position: center; box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 25%, transparent); }
  .pname { font-size: 28px; font-weight: 800; margin: 0; line-height: 1.2; }
  .bio { color: var(--muted); margin: 4px 0 0; }
  .plinks { margin-top: 8px; }
  .plinks a { margin-right: 14px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .stat { padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .stat b { display: block; font-size: 22px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .section-title { margin: 24px 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tag.ver { color: var(--accent-ink); border-color: var(--accent); }
  .row .tags { display: flex; gap: 8px; align-items: center; margin-top: 2px; }

  /* settings gear (far right of the header) */
  .gear { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px; color: var(--muted);
          transition: background .15s, color .15s; margin-left: auto; }
  .gear svg { width: 22px; height: 22px; transition: transform .5s cubic-bezier(.3, 1.2, .5, 1); }
  .gear:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
  .gear:hover svg { transform: rotate(60deg); }
  .gear.active { color: var(--accent-ink); background: var(--panel-2); }
  .gear.active svg { transform: rotate(45deg); }

  /* avatars in the leaderboard */
  .pcell { display: flex; align-items: center; }
  .avlink { display: inline-flex; margin-right: 12px; flex: none; }
  .avatar.sm { width: 36px; height: 36px; font-size: 16px; border-width: 2px; box-shadow: none; }

  /* player ranks */
  .rankpill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 6px; border-radius: 999px; font-weight: 700; font-size: 13px; white-space: nowrap;
              color: var(--text); border: 1px solid color-mix(in srgb, var(--rc) 55%, transparent); background: color-mix(in srgb, var(--rc) 15%, transparent); }
  .rankpill .ri { display: inline-flex; line-height: 0; }
  .rart { display: block; flex: none; filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, .35)); }
  .rnext { display: inline-flex; vertical-align: -3px; margin-left: 2px; }
  .rankcard { display: flex; align-items: center; gap: 18px; padding: 16px 20px; margin-bottom: 12px; border-radius: 12px;
              border: 1px solid color-mix(in srgb, var(--rc) 50%, var(--border)); background: color-mix(in srgb, var(--rc) 9%, var(--panel)); }
  .rbig { flex: none; line-height: 0; }
  .rbig .rart { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .4)); }
  .rmain { flex: 1; min-width: 0; }
  .rname { font-size: 20px; font-weight: 800; }
  .rbar { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--text) 14%, transparent); margin: 8px 0 6px; overflow: hidden; }
  .rbar i { display: block; height: 100%; border-radius: 999px; background: var(--rc); transition: width .6s ease; }
  .rsub { color: var(--muted); font-size: 13px; }

  /* country flags */
  .flag { display: inline-block; width: 20px; height: 14px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; overflow: hidden;
          box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 28%, transparent); line-height: 1; font-size: 13px; }
  .flag svg { display: block; width: 100%; height: 100%; }
  .flag.big { width: 34px; height: 23px; margin-right: 12px; vertical-align: 2px; border-radius: 3px; }
  .flag.emo { width: auto; height: auto; box-shadow: none; font-size: 15px; vertical-align: -1px; }

  /* settings page */
  .setcard { max-width: 720px; }
  .setcard + .setcard { margin-top: 16px; }
  .setcard h2 { margin: 0 0 4px; font-size: 18px; }
  .setcard .hint { color: var(--muted); margin: 0 0 16px; }
  .seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .opt { display: flex; flex-direction: column; gap: 10px; text-align: left; padding: 12px; cursor: pointer;
         border: 2px solid var(--border); border-radius: 12px; background: var(--panel-2); color: var(--text);
         font: 700 15px system-ui, sans-serif; transition: border-color .15s, transform .12s; }
  .opt:hover { border-color: var(--muted); }
  .opt:active { transform: scale(.98); }
  .opt[aria-pressed="true"] { border-color: var(--accent); }
  .mini { height: 54px; border-radius: 8px; border: 1px solid rgba(128, 128, 128, .35); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .mini i { display: block; height: 7px; border-radius: 3px; }
  .mini i:first-child { width: 55%; }
  .mini i:last-child { width: 80%; height: 12px; }
  .mini.dk { background: #0e0f13; } .mini.dk i { background: #2a2e3a; }
  .mini.lt { background: #eef1f6; } .mini.lt i { background: #cfd6e3; }
  .mini i.ac { background: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .sw { width: 40px; height: 40px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; padding: 0;
        box-shadow: inset 0 0 0 2px var(--panel), 0 0 0 1px var(--border); transition: transform .12s; }
  .sw:hover { transform: scale(1.08); }
  .sw:active { transform: scale(.94); }
  .sw[aria-pressed="true"] { border-color: var(--text); }
  .custom { display: inline-flex; align-items: center; gap: 10px; margin-left: 6px; color: var(--muted); font-weight: 600; }
  .custom input { width: 44px; height: 40px; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-2); cursor: pointer; }
  .linkbtn { margin-top: 18px; background: none; border: 1px solid var(--border); color: var(--text); padding: 9px 16px; border-radius: 10px;
             cursor: pointer; font: 600 14px system-ui, sans-serif; }
  .linkbtn:hover { border-color: var(--accent); }
  .preview-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
  .preview-row .btn { padding: 9px 18px; }

  /* home page */
  .brand a { color: inherit; text-decoration: none; }
  .home-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } }
  .home-col { display: grid; gap: 20px; min-width: 0; }
  .hcard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .hcard h2 { margin: 0 0 12px; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
  .welcome { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap;
             background: linear-gradient(135deg, var(--panel) 0%, color-mix(in srgb, var(--accent) 9%, var(--panel)) 100%); }
  .welcome .wtext { flex: 1; min-width: 260px; text-align: center; }
  .welcome h1 { margin: 0 0 8px; font-size: 32px; text-transform: uppercase; letter-spacing: .01em; }
  .welcome h1 span { color: var(--accent-ink); }
  .welcome p { margin: 6px 0; color: var(--muted); }
  .welcome p.disc { color: var(--text); }
  .welcome p.disc b { color: var(--text); }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
         font-weight: 800; letter-spacing: .04em; text-transform: uppercase; transition: filter .15s, transform .12s;
         position: relative; overflow: hidden; }
  .btn:hover { filter: brightness(1.1); text-decoration: none; }
  .btn:active { transform: scale(.96); }
  .tabs { display: flex; gap: 22px; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs h2 { margin: 0; }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 4px 2px 8px; cursor: pointer;
         color: var(--muted); font: 800 20px system-ui, sans-serif; text-transform: uppercase; transition: color .15s, border-color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .cl-body { max-height: 360px; overflow: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
             -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  .cl-date { color: var(--accent-ink); font-weight: 800; margin: 14px 0 6px; }
  .cl-date:first-child { margin-top: 0; }
  .cl-body ul { margin: 0; padding-left: 20px; }
  .cl-body li { margin: 6px 0; color: var(--muted); }
  .cl-body li strong { color: var(--text); font-weight: 600; }
  .tabin { animation: riseIn .3s ease backwards; }
  .staff h2 { text-align: center; font-size: 24px; margin-bottom: 4px; }
  .staff h3 { margin: 18px 0 6px; text-align: center; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 8px;
          background: var(--panel-2); color: var(--muted); font-size: 14px; transition: color .15s, background .15s; }
  .chip svg { width: 14px; height: 14px; flex: none; color: var(--text); }
  a.chip:hover { color: var(--accent-ink); text-decoration: none; background: color-mix(in srgb, var(--accent) 12%, var(--panel-2)); }

  /* ===== subtle animations (delete this block to turn them all off) ===== */
  @keyframes riseIn   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes badgePop { from { opacity: 0; transform: scale(.3) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes ripple   { from { transform: translate(-50%, -50%) scale(0); opacity: .35; }
                        to   { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
  @keyframes fadeOut  { to { opacity: 0; } }

  /* whole-page transitions (applied by JS when you switch pages) */
  .page-in > *:not(.row) { animation: riseIn .38s ease backwards; animation-delay: var(--d, 0ms); }
  .page-in > .layout, .page-in > .home-grid { animation: none; }
  .page-in .hcard { animation: riseIn .42s ease backwards; animation-delay: calc(var(--n, 0) * 90ms + 60ms); }
  .page-in .row, .page-in .lrow, .page-in tbody tr { animation: riseIn .38s ease backwards; animation-delay: calc(var(--n, 0) * 45ms + 90ms); }

  /* detail panel swaps when you pick a different level */
  .swap > * { animation: riseIn .3s ease backwards; animation-delay: calc(var(--k, 0) * 40ms); }
  .swap .vbadge, .page-in .vbadge { animation: badgePop .45s cubic-bezier(.3, 1.6, .5, 1) .25s backwards; }

  /* press / hover feedback */
  .row, .lrow, nav a, .modal button, .back, .btn { position: relative; overflow: hidden; }
  .row { transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; }
  .row:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
  .row:active { transform: scale(.992); }
  nav a { transition: background .15s, color .15s, transform .12s; }
  nav a:active { transform: scale(.95); }
  .modal button { transition: filter .15s, transform .12s; }
  .modal button:active { transform: scale(.97); }
  td a.plink, a.plink { transition: color .15s; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: var(--panel-2); }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; width: 340px; height: 340px;
            background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, transparent) 0%, color-mix(in srgb, var(--accent) 0%, transparent) 65%);
            animation: ripple .55s ease-out forwards; }

  /* pop-up closing */
  .modal-back { transition: opacity .18s; }
  .modal-back.closing { animation: fadeOut .18s ease forwards; }
  .modal-back.closing .modal { transform: scale(.95) translateY(6px); opacity: 0; transition: transform .18s, opacity .18s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  }

  /* disclaimer popup */
  .modal-back { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
                padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(5, 6, 10, .78); backdrop-filter: blur(4px);
                animation: fade .2s ease-out; }
  .modal { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--accent);
           border-radius: 16px; padding: 26px 26px 22px;
           box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 15%, transparent), 0 20px 60px rgba(0, 0, 0, .6), 0 0 40px color-mix(in srgb, var(--accent) 12%, transparent);
           animation: pop .25s cubic-bezier(.2, 1.2, .4, 1); }
  .modal h2 { margin: 0 0 14px; font-size: 22px; letter-spacing: .14em; color: var(--accent-ink); text-align: center; }
  .modal ol { margin: 0 0 20px; padding-left: 22px; }
  .modal li { margin: 10px 0; }
  .modal li::marker { color: var(--accent-ink); font-weight: 800; }
  .modal button { width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
                  background: var(--accent); color: var(--on-accent); font: 800 15px system-ui, sans-serif; letter-spacing: .04em; }
  .modal button:hover { filter: brightness(1.1); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: none; } }

  footer { text-align: center; color: var(--muted); padding-block: 24px; font-size: 13px;
           padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .vidwrap { display: block; position: relative; margin: 12px 0; border-radius: 10px; }
  .vidwrap .video { margin: 0; display: block; }
  .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .play svg { width: 62px; height: 62px; padding: 14px 12px 14px 17px; border-radius: 50%; color: #fff; background: rgba(0, 0, 0, .58);
              box-shadow: 0 0 0 2px rgba(255, 255, 255, .85), 0 6px 20px rgba(0, 0, 0, .5); transition: transform .15s, background .15s; }
  .vidwrap:hover .play svg { transform: scale(1.1); background: var(--accent); color: var(--on-accent); }
  .watch { display: inline-block; margin: -2px 0 14px; font-weight: 700; }
  .layout > *, .home-grid > * { min-width: 0; }

  /* ===== amethyst: the top rank gets extra shine ===== */
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes sheen { 0%, 55% { transform: translateX(-130%); } 100% { transform: translateX(130%); } }
  .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 2.6s ease-in-out infinite; }
  .rankpill.legend { background: linear-gradient(120deg, color-mix(in srgb, var(--rc) 30%, transparent), color-mix(in srgb, #ff7be8 22%, transparent));
                     box-shadow: 0 0 14px color-mix(in srgb, var(--rc) 55%, transparent); }
  .rankcard.legend { position: relative; overflow: hidden; box-shadow: 0 0 36px color-mix(in srgb, var(--rc) 38%, transparent);
                     background: linear-gradient(120deg, color-mix(in srgb, var(--rc) 24%, var(--panel)), color-mix(in srgb, #ff7be8 12%, var(--panel))); }
  .rankcard.legend::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                            background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, .22) 50%, transparent 65%);
                            transform: translateX(-130%); animation: sheen 3.8s ease-in-out infinite; }
  .rankcard.legend .rname { background: linear-gradient(90deg, #e6c8ff, #b57cff, #ff9af0); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* style picker previews */
  .mini.st-modern { background: #1a1a1a; border: 1px dashed #444; border-radius: 6px; } .mini.st-modern i { background: #333; }
  .mini.st-classic { background: #f3eddc; border: 3px double #b8ad8e; border-radius: 2px; } .mini.st-classic i { background: #cfc4a5; border-radius: 0; }
  .mini.st-classic i.ac, .mini.st-modern i.ac { background: var(--accent); }
  .mini.st-aero { background: linear-gradient(180deg, #4fbff5, #bdf0c4); border-radius: 12px; border-color: rgba(255, 255, 255, .8); }
  .mini.st-aero i { background: rgba(255, 255, 255, .85); border-radius: 99px; box-shadow: inset 0 1px 0 #fff; }
  .mini.st-aero i.ac { background: linear-gradient(180deg, rgba(255, 255, 255, .75), rgba(255, 255, 255, 0) 52%), var(--accent); }

  /* ===== SITE STYLES (Settings → Style). "Modern" is the default look defined above. ===== */
  .aero-deco { display: none; }
  main, footer { position: relative; z-index: 1; }

  /* ---------- Classic: paper, serif type, square corners, no gloss ---------- */
  :root[data-style="classic"] {
    --bg: #1b1a17; --panel: #242320; --panel-2: #2d2b27; --border: #4b473d; --text: #ece6d4; --muted: #a8a08a;
  }
  :root[data-style="classic"][data-site-theme="light"] {
    --bg: #f3eddc; --panel: #fffcf2; --panel-2: #f6f0de; --border: #bdb293; --text: #2a2418; --muted: #6b6250;
  }
  :root[data-style="classic"] body { font-family: Georgia, "Times New Roman", Times, serif; font-size: 16px; }
  :root[data-style="classic"] :is(button, input, select) { font-family: inherit; }
  :root[data-style="classic"] :is(.card, .row, .hcard, .stat, .modal, .rankcard, .opt, .btn, .linkbtn, input.search, .thumb, .video, .novideo,
      .chip, .mini, .custom input, nav a, .gear, .tab, .modal button, .rankpill, .tag) { border-radius: 3px; }
  :root[data-style="classic"] .welcome { background: var(--panel); }
  :root[data-style="classic"] .rankcard { background: color-mix(in srgb, var(--rc) 7%, var(--panel)); }
  :root[data-style="classic"] header { border-bottom: 3px double var(--border); }
  :root[data-style="classic"] .brand { font-style: italic; font-size: 22px; letter-spacing: 0; }
  :root[data-style="classic"] :is(h1, .hcard h2, .modal h2) { font-variant: small-caps; letter-spacing: .05em; font-weight: 700; text-transform: none; }
  :root[data-style="classic"] h1 { border-bottom: 3px double var(--border); padding-bottom: 8px; margin-bottom: 10px; }
  :root[data-style="classic"] .row:hover { transform: none; box-shadow: none; border-color: var(--accent); }
  :root[data-style="classic"] .modal { box-shadow: 0 6px 0 rgba(0, 0, 0, .35); border-width: 2px; }
  :root[data-style="classic"] :is(.btn, .modal button) { border: 1px solid color-mix(in srgb, var(--accent) 55%, #000); text-transform: none; letter-spacing: .02em; font-weight: 700; }
  :root[data-style="classic"] nav a.active, :root[data-style="classic"] .gear.active { background: none; border-radius: 0; box-shadow: inset 0 -3px 0 var(--accent); color: var(--text); }
  :root[data-style="classic"] th { font-variant: small-caps; text-transform: none; font-size: 14px; letter-spacing: .04em; }
  :root[data-style="classic"] .rankcard.legend { background: color-mix(in srgb, var(--rc) 14%, var(--panel)); }

  /* ---------- Frutiger Aero: sky, glass, gloss, bubbles ---------- */
  :root[data-style="aero"] {
    --bg: #06324a; --panel: rgba(255, 255, 255, .10); --panel-2: rgba(255, 255, 255, .15); --border: rgba(255, 255, 255, .28);
    --text: #eaffff; --muted: #9ed3e2;
    --glass-top: rgba(255, 255, 255, .22); --glass-bot: rgba(255, 255, 255, .07); --glass-edge: rgba(255, 255, 255, .4);
    --glass-shadow: 0 8px 24px rgba(0, 20, 40, .45); --aero-ts: 0 2px 10px rgba(0, 30, 60, .55);
    --sky: linear-gradient(180deg, #021c33 0%, #064a6b 48%, #0a8c93 100%);
  }
  :root[data-style="aero"][data-site-theme="light"] {
    --bg: #bfe9fb; --panel: rgba(255, 255, 255, .62); --panel-2: rgba(255, 255, 255, .78); --border: rgba(255, 255, 255, .95);
    --text: #0c3b57; --muted: #3f6f8b;
    --glass-top: rgba(255, 255, 255, .94); --glass-bot: rgba(255, 255, 255, .56); --glass-edge: #fff;
    --glass-shadow: 0 8px 22px rgba(10, 100, 150, .28); --aero-ts: 0 1px 0 rgba(255, 255, 255, .9);
    --sky: linear-gradient(180deg, #4fbff5 0%, #a8e6ff 38%, #e6fbff 68%, #bdf0c4 100%);
  }
  :root[data-style="aero"] body { background: var(--sky); background-attachment: fixed; background-color: var(--bg); font-family: "Segoe UI", Frutiger, "Frutiger Linotype", "Helvetica Neue", Arial, system-ui, sans-serif; }
  :root[data-style="aero"] :is(button, input) { font-family: inherit; }
  :root[data-style="aero"] .aero-deco { display: block; position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(ellipse 90% 38% at 50% 112%, rgba(110, 255, 160, .5), transparent 70%); }
  .aero-deco i { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%;
    background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.9) 0 5%, rgba(255,255,255,.22) 7% 46%, rgba(255,255,255,.05) 62%, rgba(255,255,255,.38) 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55), 0 0 24px rgba(255,255,255,.18); animation: bubble 9s ease-in-out infinite; animation-delay: var(--d); }
  @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  :root[data-style="aero"] header { background: linear-gradient(180deg, var(--glass-top), var(--glass-bot)); border-bottom: 1px solid var(--glass-edge);
    box-shadow: 0 4px 18px rgba(0, 30, 60, .25); backdrop-filter: blur(14px) saturate(1.3); }
  :root[data-style="aero"] :is(.card, .hcard, .stat, .modal, .rankcard, .row, .opt, input.search, .linkbtn, .chip) {
    background: linear-gradient(180deg, var(--glass-top), var(--glass-bot)); border: 1px solid var(--glass-edge); border-radius: 16px;
    box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, .7); backdrop-filter: blur(12px) saturate(1.3); }
  :root[data-style="aero"] .chip { border-radius: 999px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); }

  /* ===== unique home: the vault ===== */
  :root { --vault-hi: #3a3d46; --vault-lo: #15161a; }
  :root[data-site-theme="light"] { --vault-hi: #eef1f7; --vault-lo: #b9c1d1; }
  .vhero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 440px); gap: 28px; align-items: center; padding: 34px 0 30px; }
  @media (max-width: 860px) { .vhero { grid-template-columns: 1fr; } .vault { order: -1; max-width: 320px; margin: 0 auto; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; padding: 6px 12px; border: 1px dashed var(--border); border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #ff4d5e; box-shadow: 0 0 8px #ff4d5e; animation: ledblink 1.6s ease-in-out infinite; }
  @keyframes ledblink { 50% { opacity: .35; } }
  .vtitle { margin: 16px 0 6px; font-size: clamp(46px, 9vw, 92px); font-weight: 800; letter-spacing: -.04em; line-height: .98; }
  .vtitle span { color: var(--accent-ink); text-shadow: 0 0 36px color-mix(in srgb, var(--accent) 45%, transparent); }
  .vsub { margin: 0; font-size: clamp(18px, 2.6vw, 24px); color: var(--text); font-weight: 500; }
  .vp { margin: 8px 0 0; color: var(--muted); max-width: 46ch; }
  .vopen { cursor: pointer; border: 0; box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: pulse 2.4s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 14px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

  .vault { position: relative; width: 100%; aspect-ratio: 1; perspective: 1100px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .vglow { position: absolute; inset: -8%; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 38%, transparent), transparent 66%); opacity: .45; transition: opacity .8s; animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  .vinside { position: absolute; inset: 4%; border-radius: 50%; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: clamp(22px, 5vw, 34px); letter-spacing: -.02em;
             background: radial-gradient(circle, color-mix(in srgb, var(--accent) 55%, #fff 10%), color-mix(in srgb, var(--accent) 30%, #000) 70%); color: var(--on-accent); opacity: 0; transition: opacity .6s .2s; }
  .vdoor { position: absolute; inset: 0; transform-origin: 4% 50%; transition: transform 1.1s cubic-bezier(.6, .05, .2, 1); filter: drop-shadow(0 18px 28px rgba(0, 0, 0, .45)); }
  .vdoor svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .v-body { fill: var(--vault-lo); stroke: var(--border); stroke-width: 2; }
  .v-ring { stroke: var(--accent); stroke-opacity: .55; stroke-width: 2; }
  .v-ring.thin { stroke: var(--border); stroke-opacity: 1; }
  .v-bolt { fill: var(--vault-hi); stroke: var(--border); }
  .v-face { stroke: var(--border); stroke-width: 2; }
  .v-tick { stroke: var(--muted); stroke-opacity: .7; stroke-width: 2; stroke-linecap: round; }
  .v-wheel { transform-origin: 200px 200px; animation: vspin 28s linear infinite; }
  .v-rim { stroke: var(--accent); stroke-width: 9; }
  .v-spoke { stroke: var(--accent); stroke-width: 8; stroke-linecap: round; }
  .v-knob { fill: var(--vault-lo); stroke: var(--accent); stroke-width: 5; }
  .v-hubbg { fill: var(--vault-lo); stroke: var(--accent); stroke-width: 3; }
  .v-hubline { stroke: var(--accent); stroke-width: 2; stroke-opacity: .6; }
  .v-hubfill { fill: var(--accent); }
  .v-hubhole { fill: var(--vault-lo); }
  @keyframes vspin { to { transform: rotate(360deg); } }
  .vault:hover .v-wheel { animation-duration: 7s; }
  .vault.opening .v-wheel { animation: vspin 1.1s cubic-bezier(.5, 0, .2, 1) 1; }
  .vault.opening .vglow { opacity: 1; }
  .vault.opening .vinside { opacity: 1; }
  .vault.open .vdoor { transform: rotateY(-100deg); }
  .vault.open .vglow { transform: scale(1.35); opacity: 1; }
  .vault:not(.opening) { animation: vfloat 6s ease-in-out infinite; }
  @keyframes vfloat { 50% { transform: translateY(-8px); } }

/* ---- 3. Points formula ----
   Gets the rank (1 = hardest) and returns the points. Change it however you like. */
const TOP_POINTS = 500;   // points for #1
const STEP = 20;          // points lost per rank (500, 480, 460, ...)
const MIN_POINTS = 10;    // lowest a level can ever be worth
function pointsFor(rank) {
  return Math.max(TOP_POINTS - STEP * (rank - 1), MIN_POINTS);
}

function countUp(root) {
  if (REDUCED) return;
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = parseFloat(el.dataset.count); if (!isFinite(target)) return;
    const t0 = performance.now(), dur = 700;

/* ---- stats (used by the leaderboard and the profile pages) ---- */
function buildStats() {
  const players = {};
  const get = (n) => (players[n] ??= { name: n, pts: 0, beaten: [], verified: [], created: [] });
  Object.keys(PLAYERS).forEach(get);   // registered players always appear, even with 0 points
  LEVELS.forEach((l, i) => {
    const done = {};
    if (l.verifier && l.verified && VERIFIER_GETS_POINTS) done[l.verifier] = { idx: i, role: "Verifier", video: l.video };
    (l.victors || []).forEach(v => { if (v.player && !done[v.player]) done[v.player] = { idx: i, role: "Victor", video: v.video }; });
    Object.entries(done).forEach(([n, e]) => { const p = get(n); p.beaten.push(e); p.pts += ptsOf(l, i); });
    if (l.verifier) get(l.verifier).verified.push(i);
    people(l.creator).forEach(n => get(n).created.push(i));
  });
  return players;
}

/* ---- leaderboard ---- */
let lbQuery = "", lbTab = "users";
const countryName = (c) => { if (c.toLowerCase() === "cz") return "Czech Republic"; try { return new Intl.DisplayNames(["en"], { type: "region" }).of(c.toUpperCase()) || c.toUpperCase(); } catch (e) { return c.toUpperCase(); } };

    const rows = countries.map((c, i) => ({ c, i })).filter(({ c }) => !q || c.name.toLowerCase().includes(q) || c.code.includes(q));

      ? rows.map(({ c, i }) => {
          const hl = LEVELS[c.hardest];
          return `<tr><td class="lbrank">#${i + 1}</td>
            <td><div class="pcell"><span class="pn">${flagOf(c.players[0], true)}<a class="plink" href="#country-${esc(c.code)}">${esc(c.name)}</a></span></div></td>

  };

    ? "<tr><th>Rank</th><th>Player</th><th>Tier</th><th>Points</th><th>Hardest</th><th>Completions</th></tr>"
    : "<tr><th>Rank</th><th>Country</th><th>Points</th><th>Hardest</th><th>Players</th></tr>";
  const fill = () => {
    $("#lbhead").innerHTML = head();
    $("#lbbody").innerHTML = lbTab === "users" ? usersBody() : countriesBody();
    document.querySelectorAll("[data-lbtab]").forEach(b => b.classList.toggle("active", b.dataset.lbtab === lbTab));
    $("#lbq").placeholder = lbTab === "users" ? "Search players or countries" : "Search countries";
  };
  $("#app").innerHTML = `
    <div class="card lbcard">
      <div class="lbhead">
        <h1>Leaderboard</h1>
        <span class="lbupd">${sorted.length} ${sorted.length === 1 ? "player" : "players"}</span>
      </div>

      </div>
    </div>`;
  fill();
  $("#lbq").addEventListener("input", e => { lbQuery = e.target.value; fill(); });
  document.querySelectorAll("[data-lbtab]").forEach(b => b.addEventListener("click", () => { lbTab = b.dataset.lbtab; fill(); }));
}

function levelRow(i, tagHtml = "", rightHtml = "") {
  const l = LEVELS[i], th = thumbOf(l);

function avatarOf(name, cls = "") {
  const cfg = PLAYERS[name] || {};
  const hue = [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  return cfg.avatar
    ? `<div class="avatar ${cls}" style="background-image:url('${esc(cfg.avatar)}')"></div>`
    : `<div class="avatar ${cls}" style="background:hsl(${hue} 45% 32%)">${esc(name.trim().charAt(0).toUpperCase())}</div>`;
}

let ctab = "completed";
function renderCountry(code) {
  code = String(code).toLowerCase();
  const stats = buildStats(), board = boardOf(stats);
  const members = board.filter(p => String((PLAYERS[p.name] || {}).country || "").toLowerCase() === code);
  if (!members.length) {
    $("#app").innerHTML = `<a class="back" href="#leaderboard">← Leaderboard</a>
      <div class="card prose"><h2>Country not found</h2><p>No players from “${esc(code.toUpperCase())}” appear on the leaderboard yet.</p></div>`;
    return;
  }
  const names = new Set(members.map(m => m.name));
  const total = members.reduce((a, m) => a + m.pts, 0);
  const done = {};   // level index -> { by: [names], video }
  members.forEach(m => m.beaten.forEach(e => { (done[e.idx] ??= { by: [], video: "" }).by.push(m.name); if (!done[e.idx].video && e.video) done[e.idx].video = e.video; }));
  const completed = Object.keys(done).map(Number).sort((x, y) => x - y);
  const created = LEVELS.map((l, i) => i).filter(i => people(LEVELS[i].creator).some(n => names.has(n)));
  const all = {};
  board.forEach(p => { const c = String((PLAYERS[p.name] || {}).country || "").toLowerCase(); if (!c) return; (all[c] ??= { pts: 0, hardest: Infinity }); all[c].pts += p.pts; all[c].hardest = Math.min(all[c].hardest, ...p.beaten.map(e => e.idx)); });
  const ordered = (key, dir) => Object.entries(all).sort((x, y) => dir * (x[1][key] - y[1][key]));
  const ptsRank = ordered("pts", -1).findIndex(([c]) => c === code) + 1;
  const hardRank = ordered("hardest", 1).findIndex(([c]) => c === code) + 1;
  const big = /^cz$/.test(code) ? `<div class="cflag">${CZ_FLAG}</div>` : code === "fr" ? `<div class="cflag">${FR_FLAG}</div>` : code === "pl" ? `<div class="cflag">${PL_FLAG}</div>` : `<div class="cflag emo">${String.fromCodePoint(...[...code].map(ch => 0x1f1e6 + ch.charCodeAt(0) - 97))}</div>`;
  const banner = (i, right) => {
    const l = LEVELS[i], th = thumbOf(l);
    return `<div class="crow" data-open="${i}" role="button" tabindex="0" style="${th ? `--bg:url('${esc(th)}')` : ""}">
      <div class="crank">#${i + 1}</div>
      <div class="cmid"><div class="cname">${esc(l.name || "Untitled")}${badgeOf(l)}</div>
        <div class="csub">+${ptsOf(l, i)} points${l.verifiedOn ? " | " + dateFmt(l.verifiedOn) : ""}</div></div>
      <div class="cright">${right}</div></div>`;
  };
  const completedRows = () => completed.map(i => {
    const d = done[i], first = d.by[0];
    return banner(i, `<div class="cby"><small>${d.by.length > 1 ? "Completed by:" : "First completed by:"}</small><b>${esc(first)}${d.by.length > 1 ? ` <i>+${d.by.length - 1}</i>` : ""}</b></div>`
      + (d.video ? `<a class="cplay" href="${esc(d.video)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="Watch video"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg></a>` : ""));
  }).join("") || `<div class="empty">No completions yet.</div>`;
  const createdRows = () => created.map(i => banner(i, `<div class="cby"><small>Created by:</small><b>${esc(people(LEVELS[i].creator).join(", "))}</b></div>`)).join("") || `<div class="empty">No levels created yet.</div>`;
  const fillRows = () => {
    $("#crows").innerHTML = ctab === "completed" ? completedRows() : createdRows();
    document.querySelectorAll("[data-ctab]").forEach(b => b.classList.toggle("active", b.dataset.ctab === ctab));
    document.querySelectorAll(".crow").forEach(r => {
      const go = () => openLevel(+r.dataset.open);
      r.addEventListener("click", go); r.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    });
  };
  $("#app").innerHTML = `
    <a class="back" href="#leaderboard">← Leaderboard</a>
    <div class="cgrid">
      <aside class="card cside">
        ${big}
        <h1 class="cname-big">${esc(countryName(code))}</h1>
        <div class="clabel">Level points</div><div class="cpts" data-count="${round2(total)}">${round2(total)}</div>
        <h3 class="chead">Rankings</h3>
        <div class="crk"><span>Points rank</span><b>#${ptsRank}</b></div>
        <div class="crk"><span>Hardest level rank</span><b>#${hardRank}</b></div>
        <div class="crk"><span>Players</span><b>${members.length}</b></div>
        <h3 class="chead">Country members</h3>
        <div class="cmem">${members.map((m, i) => `<a class="cm" href="${pHref(m.name)}">${avatarOf(m.name, "sm")}<span>${esc(m.name)}</span><em>${round2(m.pts)} pts</em></a>`).join("")}</div>
      </aside>
      <section class="cmain">
        <div class="ctabs"><button type="button" data-ctab="completed">Completed (${completed.length})</button><button type="button" data-ctab="created">Created (${created.length})</button></div>
        <div id="crows"></div>
      </section>
    </div>`;
  fillRows();
  document.querySelectorAll("[data-ctab]").forEach(b => b.addEventListener("click", () => { ctab = b.dataset.ctab; fillRows(); }));
}

    ${p.created.length ? `<div class="section-title">Levels created (${p.created.length})</div>${p.created.map(i => levelRow(i)).join("")}` : ""}
  `;
  document.querySelectorAll(".row[data-open]").forEach(r =>
    r.addEventListener("click", () => openLevel(+r.dataset.open)));
}

/* ---- text pages ---- */
function renderPage(page) {
  const out = []; let open = "";
  const close = () => { if (open) { out.push(`</${open}>`); open = ""; } };
  for (const line of page.body) {
    const num = line.match(/^\d+\.\s+(.*)/);
    const bul = line.startsWith("- ");
    if (num || bul) {
      const tag = num ? "ol" : "ul";
      if (open !== tag) { close(); out.push(`<${tag}>`); open = tag; }
      out.push(`<li>${esc(num ? num[1] : line.slice(2))}</li>`);
    } else {
      close();
      out.push(`<p>${esc(line)}</p>`);
    }
  }
  close();
  $("#app").innerHTML = `<div class="card prose"><h2>${esc(page.title)}</h2>${out.join("")}</div>`;
}

      <div class="vst"><b data-count="${totalPts}">${totalPts}</b><span>Points up for grabs</span></div>
    </div>

    <h2 class="sec-title">Inside the vault</h2>
    <p class="sec-sub">The three hardest levels on the list. Click one to open it.</p>
    <div class="treasure">${treasure}</div>

    ${podium ? `<h2 class="sec-title">Top of the leaderboard</h2><div class="podium">${podium}</div>` : ""}

    <div class="home-grid" style="margin-top:44px">
      <div class="hcard">
        <div class="tabs">
          <h2>${esc(HOME.changelogTitle)}</h2>
          ${CHANGELOG.map((t, i) => `<button class="tab ${i === clTab ? "active" : ""}" data-tab="${i}" type="button">${esc(t.tab)}</button>`).join("")}
        </div>
        <div class="cl-body" id="clbody">${changelogHTML()}</div>
      </div>
      <aside class="hcard staff">
        <h2>${esc(HOME.staffTitle)}</h2>
        ${STAFF.filter(g => g.names && g.names.length).map(g => `
          <h3>${esc(g.role)}</h3>
          <div class="chips">${g.names.map(n => {
            const inner = `${ICONS[g.icon] || ""}${esc(n)}`;
            return stats[n] ? `<a class="chip" href="${pHref(n)}">${inner}</a>` : `<span class="chip">${inner}</span>`;
          }).join("")}</div>`).join("")}
      </aside>
    </div>

    <h2 class="sec-title">${esc(HOME.faqTitle)}</h2>
    <div class="faq">${HOME.faq.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("")}</div>`;

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    clTab = +b.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", +x.dataset.tab === clTab));
    const body = $("#clbody"); body.innerHTML = changelogHTML(); if (!REDUCED) restart(body, "tabin");
  }));
  document.querySelectorAll(".tcard[data-open]").forEach(c => {
    c.addEventListener("click", () => openLevel(+c.dataset.open));
    c.addEventListener("pointermove", e => {
      const r = c.getBoundingClientRect();
      c.style.setProperty("--ry", ((e.clientX - r.left) / r.width - .5) * 10 + "deg");
      c.style.setProperty("--rx", (-((e.clientY - r.top) / r.height - .5)) * 8 + "deg");
    });
    c.addEventListener("pointerleave", () => { c.style.setProperty("--rx", "0deg"); c.style.setProperty("--ry", "0deg"); });
  });
}

/* ---- settings (theme + accent color, saved in this browser) ---- */
const SWATCHES = [["Green", "#3ddc84"], ["Blue", "#4da3ff"], ["Purple", "#a66bff"], ["Pink", "#ff5fa2"],
                  ["Orange", "#ff9f43"], ["Red", "#ff4d5e"], ["Yellow", "#ffd23f"], ["Teal", "#2ec4b6"], ["Lime", "#b5e61d"], ["Cyan", "#22d3ee"], ["White", "#f2f2f2"]];
/* color themes: id, label, background, surface (for the preview tiles) */
const THEMES = [["auto", "Auto", "#0e0f13", "#eef1f6"], ["dark", "Dark", "#121212", "#2a2a2a"], ["light", "Light", "#eef1f6", "#cfd6e3"], ["midnight", "Midnight", "#0b1020", "#222d52"],
                ["amoled", "AMOLED", "#000000", "#1a1a1a"], ["forest", "Forest", "#0d1511", "#26402f"], ["sunset", "Sunset", "#1a0f14", "#4a2530"], ["grape", "Grape", "#130e1c", "#3a2a57"]];
const SIZES = [["small", "Small"], ["normal", "Normal"], ["large", "Large"]];
const ROUNDS = [["sharp", "Sharp"], ["normal", "Normal"], ["round", "Round"]];
const DEFAULT_SETTINGS = { theme: "dark", accent: "#4da3ff", style: "modern", size: "normal", round: "normal", density: "comfy", motion: "on", glow: "on" };
const STYLES = [["modern", "Modern"], ["classic", "Classic"], ["aero", "Frutiger Aero"], ["neon", "Neon"], ["brutal", "Brutalist"], ["terminal", "Terminal"]];
const SETTINGS_KEY = "demonvault-settings";
let SETTINGS = { ...DEFAULT_SETTINGS };

function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");
    if (THEMES.some(x => x[0] === o.theme)) SETTINGS.theme = o.theme;
    if (SIZES.some(x => x[0] === o.size)) SETTINGS.size = o.size;
    if (ROUNDS.some(x => x[0] === o.round)) SETTINGS.round = o.round;
    if (o.density === "comfy" || o.density === "compact") SETTINGS.density = o.density;
    if (o.motion === "on" || o.motion === "off") SETTINGS.motion = o.motion;
    if (o.glow === "on" || o.glow === "off") SETTINGS.glow = o.glow;
    if (/^#[0-9a-f]{6}$/i.test(o.accent || "")) SETTINGS.accent = o.accent.toLowerCase();
    if (STYLES.some(x => x[0] === o.style)) SETTINGS.style = o.style;
  } catch (e) {}
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(SETTINGS)); } catch (e) {} }
function onAccent(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.32 ? "#08120d" : "#ffffff";
}
function applySettings(animate) {
  const root = document.documentElement;
  if (animate && !REDUCED) { root.classList.add("theming"); setTimeout(() => root.classList.remove("theming"), 350); }
  const sysDark = !(window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
  root.setAttribute("data-site-theme", SETTINGS.theme === "auto" ? (sysDark ? "dark" : "light") : SETTINGS.theme);
  ["size", "round", "density", "motion", "glow"].forEach(k => root.setAttribute("data-" + k, SETTINGS[k]));
  root.setAttribute("data-style", SETTINGS.style);
  root.style.setProperty("--accent", SETTINGS.accent);
  root.style.setProperty("--on-accent", onAccent(SETTINGS.accent));
}

function renderSettings() {
  $("#app").innerHTML = `
    <h1>Settings</h1>
    <div class="sub">Changes apply right away and are remembered on this device.</div>

    <div class="hcard setcard">
      <h2>Style</h2>
      <p class="hint">Pick the overall look of the site. Accent color applies to every style. Neon, Brutalist and Terminal bring their own colors.</p>
      <div class="seg">
        ${STYLES.map(([id, n]) => `<button class="opt" type="button" data-style-opt="${id}"><span class="mini st-${id}"><i></i><i class="ac"></i></span>${n}</button>`).join("")}
      </div>
    </div>

    <div class="hcard setcard">
      <h2>Theme</h2>
      <p class="hint">Pick a color theme. “Auto” follows your device. Color themes apply to the Modern style.</p>
      <div class="seg">
        ${THEMES.map(([id, n, bg, sf]) => `<button class="opt" type="button" data-theme-opt="${id}"><span class="mini" style="background:${bg}"><i style="background:${sf}"></i><i class="ac"></i></span>${n}</button>`).join("")}
      </div>
    </div>

    <div class="hcard setcard">
      <h2>Accent color</h2>
      <p class="hint">Used for highlights, buttons, links and the verified badge.</p>
      <div class="swatches">
        ${SWATCHES.map(([n, c]) => `<button class="sw" type="button" data-accent="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join("")}
        <label class="custom">Custom <input type="color" id="customColor" aria-label="Custom accent color"></label>
      </div>
      <div class="preview-row">
        <span class="btn">Preview</span>
        <span class="vbadge" style="width:22px;height:22px"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><path d="M2.2 6.4l2.6 2.6 5-5.6"/></svg></span>
        <a href="#site-settings" onclick="return false">Sample link</a>
      </div>
    </div>

    <div class="hcard setcard">
      <h2>Display</h2>
      <p class="hint">Make the site easier on your eyes.</p>
      <div class="srow"><span>Text size</span><div class="pills">${SIZES.map(([id, n]) => `<button class="pill" type="button" data-set="size" data-val="${id}">${n}</button>`).join("")}</div></div>
      <div class="srow"><span>Corners</span><div class="pills">${ROUNDS.map(([id, n]) => `<button class="pill" type="button" data-set="round" data-val="${id}">${n}</button>`).join("")}</div></div>
      <div class="srow"><span>Density</span><div class="pills"><button class="pill" type="button" data-set="density" data-val="comfy">Comfy</button><button class="pill" type="button" data-set="density" data-val="compact">Compact</button></div></div>
      <div class="srow"><span>Animations</span><div class="pills"><button class="pill" type="button" data-set="motion" data-val="on">On</button><button class="pill" type="button" data-set="motion" data-val="off">Off</button></div></div>
      <div class="srow"><span>Background glow</span><div class="pills"><button class="pill" type="button" data-set="glow" data-val="on">On</button><button class="pill" type="button" data-set="glow" data-val="off">Off</button></div></div>
      <button class="linkbtn" id="resetSet" type="button">Reset to default</button>
    </div>`;

  const refresh = () => {
    document.querySelectorAll("[data-style-opt]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.styleOpt === SETTINGS.style)));
    document.querySelectorAll("[data-theme-opt]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.themeOpt === SETTINGS.theme)));
    document.querySelectorAll("[data-accent]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.accent === SETTINGS.accent)));
    $("#customColor").value = SETTINGS.accent;
    document.querySelectorAll("[data-set]").forEach(b => b.setAttribute("aria-pressed", String(SETTINGS[b.dataset.set] === b.dataset.val)));
  };
  const change = (patch) => { Object.assign(SETTINGS, patch); applySettings(true); saveSettings(); refresh(); };
  document.querySelectorAll("[data-style-opt]").forEach(b => b.addEventListener("click", () => change({ style: b.dataset.styleOpt })));
  document.querySelectorAll("[data-theme-opt]").forEach(b => b.addEventListener("click", () => change({ theme: b.dataset.themeOpt })));
  document.querySelectorAll("[data-accent]").forEach(b => b.addEventListener("click", () => change({ accent: b.dataset.accent })));
  document.querySelectorAll("[data-set]").forEach(b => b.addEventListener("click", () => change({ [b.dataset.set]: b.dataset.val })));
  $("#customColor").addEventListener("input", (e) => {
    SETTINGS.accent = e.target.value.toLowerCase(); applySettings(false); saveSettings();
    document.querySelectorAll("[data-accent]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.accent === SETTINGS.accent)));
  });
  $("#resetSet").addEventListener("click", () => change({ ...DEFAULT_SETTINGS }));
  refresh();
}

/* ---- disclaimer pop-up ---- */
function showDisclaimer() {
  if (!DISCLAIMER.enabled) return;
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dtitle">
      <h2 id="dtitle">${esc(DISCLAIMER.title)}</h2>
      <ol>${DISCLAIMER.items.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      <button type="button">${esc(DISCLAIMER.button)}</button>
    </div>`;
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    document.removeEventListener("keydown", onKey);
    back.classList.add("closing");
    setTimeout(() => back.remove(), REDUCED ? 0 : 200);
  };
  const onKey = (e) => { if (e.key === "Escape" || e.key === "Enter") close(); };
  back.querySelector("button").addEventListener("click", close);
  back.addEventListener("click", (e) => { if (e.target === back) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(back);
  back.querySelector("button").focus();
}

/* ---- router ---- */
function route() {
  renderChrome();
  render();
  animatePage();
}
function render() {
  const h = location.hash.replace(/^#/, "");
  if (h === "" || h === "home") return renderHome();
  if (h === "list") return renderList();
  if (h === "leaderboard") return renderLeaderboard();
  if (h === "site-settings") return renderSettings();
  if (h.startsWith("country-")) return renderCountry(h.slice(8));
  if (h.startsWith("player-")) {
    const n = Object.keys(buildStats()).find(k => "player-" + slug(k) === h);
    return renderProfile(n || h.slice(7));
  }
  const page = PAGES.find(p => p.id === h);
  if (page) return renderPage(page);
  renderList();
}
window.addEventListener("hashchange", route);
loadSettings();
applySettings(false);
route();
showDisclaimer();
</script>
