<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>DemonVault</title>
<style>
  /* ===== THEME: change colors here ===== */
  :root {
    color-scheme: dark;
    --bg: #0e0f13;
    --panel: #171921;
    --panel-2: #1f222c;
    --border: #2a2e3a;
    --text: #e8eaf0;
    --muted: #8b90a0;
    --accent: #3ddc84;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { background: var(--panel); border-bottom: 1px solid var(--border);
           position: sticky; top: env(safe-area-inset-top, 0px); z-index: 11; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .bar { max-width: 1200px; margin: 0 auto; min-height: 56px; padding-block: 6px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
         display: flex; align-items: center; flex-wrap: wrap; gap: 4px 24px; }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: .5px; }
  .brand span { color: var(--accent); }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav a { color: var(--muted); padding: 8px 12px; border-radius: 8px; font-weight: 600; }
  nav a:hover { background: var(--panel-2); text-decoration: none; color: var(--text); }
  nav a.active { color: var(--text); background: var(--panel-2); }

  main { max-width: 1200px; margin: 0 auto; padding-block: 24px 64px;
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin-bottom: 20px; }

  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  input.search { width: 100%; padding: 10px 14px; margin-bottom: 12px; border-radius: 10px;
                 border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 15px; }
  input.search:focus { outline: 2px solid var(--accent); }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }

  /* list rows */
  .row { display: flex; gap: 14px; align-items: center; padding: 10px 14px;
         border: 1px solid var(--border); background: var(--panel); border-radius: 12px;
         margin-bottom: 8px; cursor: pointer; transition: .12s; }
  .row:hover { border-color: var(--accent); }
  .row.selected { border-color: var(--accent); background: var(--panel-2); }
  .rank { font-size: 20px; font-weight: 800; min-width: 44px; text-align: center; color: #fff; }
  .rank.top { color: var(--accent); }   /* ranks 1-3 (see TOP_COUNT in the script) */
  .thumb { width: 128px; height: 72px; border-radius: 8px; background: var(--panel-2) center/cover;
           flex: none; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
  .info { flex: 1; min-width: 0; }
  .lname { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lname .ltxt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vbadge { display: inline-flex; flex: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); align-items: center; justify-content: center;
            box-shadow: 0 0 8px rgba(61, 220, 132, .55); }
  .vbadge svg { width: 11px; height: 11px; }
  .detail h2 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meta { color: var(--muted); font-size: 13px; }
  .pts { color: var(--accent); font-weight: 700; white-space: nowrap; }
  @media (max-width: 520px) { .thumb { display: none; } }

  /* detail panel */
  .detail { position: sticky; top: 76px; padding: 18px; }
  .detail h2 { margin: 0 0 4px; font-size: 22px; }
  .video { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: 10px; background: var(--panel-2); margin: 12px 0; }
  .novideo { aspect-ratio: 16/9; display: grid; place-items: center; background: var(--panel-2);
             border-radius: 10px; color: var(--muted); margin: 12px 0; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; word-break: break-word; }
  .detail h3 { margin: 16px 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .victors { margin: 0; padding: 0; list-style: none; max-height: 220px; overflow: auto; }
  .victors li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .empty { color: var(--muted); font-style: italic; }

  /* tables */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  tr:last-child td { border-bottom: 0; }
  td.num { font-weight: 800; color: var(--muted); width: 60px; }

  /* text pages */
  .prose { padding: 22px; }
  .prose h2 { margin-top: 0; }
  .prose ul { padding-left: 20px; }
  .prose li { margin: 6px 0; }

  /* player links + profiles */
  a.plink { color: inherit; }
  a.plink:hover { color: var(--accent); text-decoration: underline; }
  td a.plink { font-weight: 700; }
  .back { display: inline-block; margin-bottom: 14px; color: var(--muted); font-weight: 600; }
  .back:hover { color: var(--text); text-decoration: none; }
  .profile-head { display: flex; gap: 20px; align-items: center; padding: 22px; margin-bottom: 16px; flex-wrap: wrap; }
  .avatar { width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
            font-size: 36px; font-weight: 800; color: #fff; border: 3px solid var(--accent);
            background-size: cover; background-position: center; box-shadow: 0 0 24px rgba(61, 220, 132, .25); }
  .pname { font-size: 28px; font-weight: 800; margin: 0; line-height: 1.2; }
  .bio { color: var(--muted); margin: 4px 0 0; }
  .plinks { margin-top: 8px; }
  .plinks a { margin-right: 14px; font-weight: 600; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .stat { padding: 14px 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
  .stat b { display: block; font-size: 22px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
  .section-title { margin: 24px 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tag.ver { color: var(--accent); border-color: var(--accent); }
  .row .tags { display: flex; gap: 8px; align-items: center; margin-top: 2px; }

  /* home page */
  .brand a { color: inherit; text-decoration: none; }
  .home-grid { display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .home-grid { grid-template-columns: 1fr; } }
  .home-col { display: grid; gap: 20px; min-width: 0; }
  .hcard { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  .hcard h2 { margin: 0 0 12px; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
  .welcome { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap;
             background: linear-gradient(135deg, var(--panel) 0%, #14201b 100%); }
  .welcome .wtext { flex: 1; min-width: 260px; text-align: center; }
  .welcome h1 { margin: 0 0 8px; font-size: 32px; text-transform: uppercase; letter-spacing: .01em; }
  .welcome h1 span { color: var(--accent); }
  .welcome p { margin: 6px 0; color: var(--muted); }
  .welcome p.disc { color: var(--text); }
  .welcome p.disc b { color: #fff; }
  .btn { display: inline-block; padding: 12px 22px; border-radius: 10px; background: var(--accent); color: #06210f;
         font-weight: 800; letter-spacing: .04em; text-transform: uppercase; transition: filter .15s, transform .12s;
         position: relative; overflow: hidden; }
  .btn:hover { filter: brightness(1.1); text-decoration: none; }
  .btn:active { transform: scale(.96); }
  .tabs { display: flex; gap: 22px; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs h2 { margin: 0; }
  .tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 4px 2px 8px; cursor: pointer;
         color: var(--muted); font: 800 20px system-ui, sans-serif; text-transform: uppercase; transition: color .15s, border-color .15s; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .cl-body { max-height: 360px; overflow: auto; padding-right: 8px; scrollbar-width: thin; scrollbar-color: var(--border) transparent;
             -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  .cl-date { color: var(--accent); font-weight: 800; margin: 14px 0 6px; }
  .cl-date:first-child { margin-top: 0; }
  .cl-body ul { margin: 0; padding-left: 20px; }
  .cl-body li { margin: 6px 0; color: var(--muted); }
  .cl-body li strong { color: var(--text); font-weight: 600; }
  .tabin { animation: riseIn .3s ease backwards; }
  .partners { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
  .partner { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 12px;
             background: var(--panel-2); color: var(--text); transition: border-color .15s, transform .15s; }
  a.partner:hover { border-color: var(--accent); transform: translateY(-1px); text-decoration: none; }
  .partner .pi { width: 42px; height: 42px; border-radius: 10px; flex: none; display: grid; place-items: center;
                 background: var(--bg); color: var(--accent); font-weight: 800; font-size: 18px; background-size: cover; background-position: center; }
  .partner b { display: block; }
  .partner small { color: var(--muted); }
  .staff h2 { text-align: center; font-size: 24px; margin-bottom: 4px; }
  .staff h3 { margin: 18px 0 6px; text-align: center; font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 8px;
          background: var(--panel-2); color: var(--muted); font-size: 14px; transition: color .15s, background .15s; }
  .chip svg { width: 14px; height: 14px; flex: none; color: var(--text); }
  a.chip:hover { color: var(--accent); text-decoration: none; background: #232733; }

  /* ===== subtle animations (delete this block to turn them all off) ===== */
  @keyframes riseIn   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes badgePop { from { opacity: 0; transform: scale(.3) rotate(-25deg); } to { opacity: 1; transform: none; } }
  @keyframes ripple   { from { transform: translate(-50%, -50%) scale(0); opacity: .35; }
                        to   { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
  @keyframes fadeOut  { to { opacity: 0; } }

  /* whole-page transitions (applied by JS when you switch pages) */
  .page-in > *:not(.row) { animation: riseIn .38s ease backwards; animation-delay: var(--d, 0ms); }
  .page-in > .layout, .page-in > .home-grid { animation: none; }
  .page-in .hcard { animation: riseIn .42s ease backwards; animation-delay: calc(var(--n, 0) * 90ms + 60ms); }
  .page-in .row, .page-in tbody tr { animation: riseIn .38s ease backwards; animation-delay: calc(var(--n, 0) * 45ms + 90ms); }

  /* detail panel swaps when you pick a different level */
  .swap > * { animation: riseIn .3s ease backwards; animation-delay: calc(var(--k, 0) * 40ms); }
  .swap .vbadge, .page-in .vbadge { animation: badgePop .45s cubic-bezier(.3, 1.6, .5, 1) .25s backwards; }

  /* press / hover feedback */
  .row, nav a, .modal button, .back, .btn { position: relative; overflow: hidden; }
  .row { transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; }
  .row:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, .25); }
  .row:active { transform: scale(.992); }
  nav a { transition: background .15s, color .15s, transform .12s; }
  nav a:active { transform: scale(.95); }
  .modal button { transition: filter .15s, transform .12s; }
  .modal button:active { transform: scale(.97); }
  td a.plink, a.plink { transition: color .15s; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: var(--panel-2); }
  .ripple { position: absolute; border-radius: 50%; pointer-events: none; width: 340px; height: 340px;
            background: radial-gradient(circle, rgba(61, 220, 132, .55) 0%, rgba(61, 220, 132, 0) 65%);
            animation: ripple .55s ease-out forwards; }

  /* pop-up closing */
  .modal-back { transition: opacity .18s; }
  .modal-back.closing { animation: fadeOut .18s ease forwards; }
  .modal-back.closing .modal { transform: scale(.95) translateY(6px); opacity: 0; transition: transform .18s, opacity .18s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
  }

  /* disclaimer popup */
  .modal-back { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
                padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(5, 6, 10, .78); backdrop-filter: blur(4px);
                animation: fade .2s ease-out; }
  .modal { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--accent);
           border-radius: 16px; padding: 26px 26px 22px;
           box-shadow: 0 0 0 1px rgba(61, 220, 132, .15), 0 20px 60px rgba(0, 0, 0, .6), 0 0 40px rgba(61, 220, 132, .12);
           animation: pop .25s cubic-bezier(.2, 1.2, .4, 1); }
  .modal h2 { margin: 0 0 14px; font-size: 22px; letter-spacing: .14em; color: var(--accent); text-align: center; }
  .modal ol { margin: 0 0 20px; padding-left: 22px; }
  .modal li { margin: 10px 0; }
  .modal li::marker { color: var(--accent); font-weight: 800; }
  .modal button { width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
                  background: var(--accent); color: #06210f; font: 800 15px system-ui, sans-serif; letter-spacing: .04em; }
  .modal button:hover { filter: brightness(1.1); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop  { from { opacity: 0; transform: scale(.92) translateY(8px); } to { opacity: 1; transform: none; } }

  footer { text-align: center; color: var(--muted); padding-block: 24px; font-size: 13px;
           padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .watch { display: inline-block; margin: -2px 0 14px; font-weight: 700; }
  .layout > *, .home-grid > * { min-width: 0; }
</style>
<header>
  <div class="bar">
    <div class="brand" id="brand"></div>
    <nav id="nav"></nav>
  </div>
</header>
<main id="app"></main>
<footer id="footer"></footer>

  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function ytId(url) {
  if (!url) return "";
  const m = String(url).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : "";
}
const ptsOf = (lvl, i) => lvl.points ?? pointsFor(i + 1);
function thumbOf(l) { return l.thumb || ""; }

const BADGE = `<span class="vbadge" title="Verified"><svg viewBox="0 0 12 12" fill="none" stroke="#06210f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.4l2.6 2.6 5-5.6"/></svg></span>`;
const badgeOf = (l) => (l.verified ? BADGE : "");

const slug = (n) => String(n).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "player";
const pHref = (n) => "#player-" + slug(n);
const pLink = (n) => `<a class="plink" href="${pHref(n)}">${esc(n)}</a>`;
const people = (str) => String(str || "").split(",").map(x => x.trim()).filter(Boolean);
const peopleLinks = (str) => people(str).map(pLink).join(", ");

/* ---- animation helpers ---- */
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const restart = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

function animateDetail() {
  const d = $("#detail"); if (!d || REDUCED) return;
  [...d.children].forEach((c, i) => c.style.setProperty("--k", i));
  restart(d, "swap");
}
function countUp(root) {
  if (REDUCED) return;
  root.querySelectorAll("[data-count]").forEach(el => {
    const target = parseFloat(el.dataset.count); if (!isFinite(target)) return;
    const t0 = performance.now(), dur = 700;
    el.textContent = "0";
    const tick = (now) => {
      const k = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - k, 3);
      el.textContent = String(Math.round(target * e * 100) / 100);
      if (k < 1) requestAnimationFrame(tick); else el.textContent = String(target);
    };
    requestAnimationFrame(tick);
  });
}
function animatePage() {
  const app = $("#app"); if (REDUCED) return;
  [...app.children].forEach((c, i) => c.style.setProperty("--d", Math.min(i, 9) * 45 + "ms"));
  app.querySelectorAll(".row, tbody tr, .hcard").forEach((r, i) => r.style.setProperty("--n", Math.min(i, 12)));
  restart(app, "page-in");
  animateDetail();
  countUp(app);
}
/* click ripple on rows, nav links, buttons */
document.addEventListener("click", (e) => {
  if (REDUCED) return;
  const host = e.target.closest(".row, nav a, .modal button, .back, .btn"); if (!host) return;
  const r = host.getBoundingClientRect(), s = document.createElement("span");
  s.className = "ripple"; s.style.left = (e.clientX - r.left) + "px"; s.style.top = (e.clientY - r.top) + "px";
  host.appendChild(s); setTimeout(() => s.remove(), 600);
});

let selected = 0;
let query = "";

/* ---- chrome ---- */
function renderChrome() {
  document.title = SITE.name;
  const name = esc(SITE.name);
  const hl = esc(SITE.highlight);
  $("#brand").innerHTML = `<a href="#home">${hl && name.includes(hl) ? name.replace(hl, `<span>${hl}</span>`) : name}</a>`;
  const links = [
    { h: "#home", t: "Home" },
    { h: "#list", t: "List" },
    { h: "#leaderboard", t: "Leaderboard" },
    ...PAGES.map(p => ({ h: "#" + p.id, t: p.title })),
  ];
  const cur0 = location.hash && location.hash !== "#" ? location.hash : "#home";
  const cur = cur0.startsWith("#player-") ? "#leaderboard" : cur0;
  $("#nav").innerHTML = links.map(l =>
    `<a href="${l.h}" class="${l.h === cur ? "active" : ""}">${esc(l.t)}</a>`).join("") +
    (SITE.discord ? `<a href="${esc(SITE.discord)}" target="_blank" rel="noopener">Discord</a>` : "");
  $("#footer").textContent = SITE.footer;
}

/* ---- list page ---- */
function renderList() {
  const q = query.trim().toLowerCase();
  const rows = LEVELS.map((l, i) => ({ l, i })).filter(({ l }) =>
    !q || [l.name, l.creator, l.verifier, l.id].some(v => String(v || "").toLowerCase().includes(q)));

  $("#app").innerHTML = `
    <h1>Demonlist</h1>
    <div class="sub">${esc(SITE.tagline)}</div>
    <div class="layout">
      <div>
        <input class="search" id="q" placeholder="Search level, creator, verifier or ID…" value="${esc(query)}">
        <div id="rows">
          ${rows.length ? rows.map(({ l, i }) => {
            const th = thumbOf(l);
            return `<div class="row ${i === selected ? "selected" : ""}" data-i="${i}">
              <div class="rank ${i < TOP_COUNT ? "top" : ""}">#${i + 1}</div>
              <div class="thumb" style="${th ? `background-image:url('${esc(th)}')` : ""}">${th ? "" : "no image"}</div>
              <div class="info">
                <div class="lname"><span class="ltxt">${esc(l.name || "Untitled")}</span>${badgeOf(l)}</div>
                <div class="meta">${esc(l.creator || "unknown creator")}</div>
              </div>
              <div class="pts">${ptsOf(l, i)} pts</div>
            </div>`;
          }).join("") : `<div class="empty">No levels match.</div>`}
        </div>
      </div>
      <aside class="card detail" id="detail"></aside>
    </div>`;

  $("#q").addEventListener("input", e => {
    query = e.target.value;
    const pos = e.target.selectionStart;
    renderList();
    const el = $("#q"); el.focus(); el.setSelectionRange(pos, pos);
  });
  document.querySelectorAll(".row").forEach(r =>
    r.addEventListener("click", () => {
      const i = +r.dataset.i; if (i === selected) return;
      selected = i;
      document.querySelectorAll("#rows .row").forEach(x => x.classList.toggle("selected", +x.dataset.i === selected));
      renderDetail(); animateDetail();
    }));
  renderDetail();
}

function renderDetail() {
  const el = $("#detail");
  const l = LEVELS[selected];
  if (!l) { el.innerHTML = `<div class="empty">Add a level to LEVELS to get started.</div>`; return; }
  const victors = l.victors || [];
  el.innerHTML = `
    <h2><span>#${selected + 1} · ${esc(l.name || "Untitled")}</span>${badgeOf(l)}</h2>
    <div class="meta">${ptsOf(l, selected)} points</div>
    ${thumbOf(l)
      ? `<img class="video" src="${esc(thumbOf(l))}" alt="" style="object-fit:cover">`
      : `<div class="novideo">No image yet</div>`}
    ${l.video ? `<a class="watch" href="${esc(l.video)}" target="_blank" rel="noopener">▶ Watch the verification</a>` : ""}
    <dl>
      <dt>Level ID</dt><dd>${esc(l.id) || "—"}</dd>
      <dt>Creator</dt><dd>${peopleLinks(l.creator) || "—"}</dd>
      <dt>Verifier</dt><dd>${peopleLinks(l.verifier) || "—"}</dd>
    </dl>
    <h3>Victors (${victors.length})</h3>
    ${victors.length
      ? `<ul class="victors">${victors.map(v => `<li><span>${pLink(v.player)}</span>${
          v.video ? `<a href="${esc(v.video)}" target="_blank" rel="noopener">video</a>` : ""}</li>`).join("")}</ul>`
      : `<div class="empty">No victors yet.</div>`}`;
}

/* ---- stats (used by the leaderboard and the profile pages) ---- */
function buildStats() {
  const players = {};
  const get = (n) => (players[n] ??= { name: n, pts: 0, beaten: [], verified: [], created: [] });
  LEVELS.forEach((l, i) => {
    const done = {};
    if (l.verifier && VERIFIER_GETS_POINTS) done[l.verifier] = { idx: i, role: "Verifier", video: l.video };
    (l.victors || []).forEach(v => { if (v.player && !done[v.player]) done[v.player] = { idx: i, role: "Victor", video: v.video }; });
    Object.entries(done).forEach(([n, e]) => { const p = get(n); p.beaten.push(e); p.pts += ptsOf(l, i); });
    if (l.verifier) get(l.verifier).verified.push(i);
    people(l.creator).forEach(n => get(n).created.push(i));
  });
  return players;
}
const boardOf = (stats) => Object.values(stats).filter(p => p.beaten.length).sort((a, b) => b.pts - a.pts);
const round2 = (n) => Math.round(n * 100) / 100;

/* ---- leaderboard ---- */
function renderLeaderboard() {
  const sorted = boardOf(buildStats());
  $("#app").innerHTML = `
    <h1>Leaderboard</h1>
    <div class="sub">Calculated automatically from the victors in your list. Click a player to see their profile.</div>
    <div class="card">
      <table>
        <thead><tr><th>#</th><th>Player</th><th>Completions</th><th>Points</th></tr></thead>
        <tbody>
          ${sorted.length
            ? sorted.map((p, i) => `<tr><td class="num">${i + 1}</td><td>${pLink(p.name)}</td>
                <td>${p.beaten.length}</td><td class="pts" data-count="${round2(p.pts)}">${round2(p.pts)}</td></tr>`).join("")
            : `<tr><td colspan="4" class="empty">No players yet — add verifiers or victors to your levels.</td></tr>`}
        </tbody>
      </table>
    </div>`;
}

/* ---- player profile ("portfolio") ---- */
function openLevel(i) {
  selected = i; query = "";
  if (location.hash === "#list") route(); else location.hash = "#list";
}

function levelRow(i, tagHtml = "", rightHtml = "") {
  const l = LEVELS[i], th = thumbOf(l);
  return `<div class="row" data-open="${i}">
    <div class="rank ${i < TOP_COUNT ? "top" : ""}">#${i + 1}</div>
    <div class="thumb" style="${th ? `background-image:url('${esc(th)}')` : ""}">${th ? "" : "no image"}</div>
    <div class="info">
      <div class="lname"><span class="ltxt">${esc(l.name || "Untitled")}</span>${badgeOf(l)}</div>
      <div class="tags"><span class="meta">${esc(l.creator || "unknown creator")}</span>${tagHtml}</div>
    </div>
    <div class="pts">${rightHtml}${ptsOf(l, i)} pts</div>
  </div>`;
}

function renderProfile(name) {
  const stats = buildStats();
  const p = stats[name];
  if (!p) {
    $("#app").innerHTML = `<a class="back" href="#leaderboard">← Leaderboard</a>
      <div class="card prose"><h2>Player not found</h2><p>Nobody called “${esc(name)}” appears in the list yet.</p></div>`;
    return;
  }
  const cfg = PLAYERS[name] || {};
  const board = boardOf(stats);
  const rankPos = board.findIndex(b => b.name === name) + 1;
  const beaten = [...p.beaten].sort((a, b) => a.idx - b.idx);
  const hue = [...name].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  const avatar = cfg.avatar
    ? `<div class="avatar" style="background-image:url('${esc(cfg.avatar)}')"></div>`
    : `<div class="avatar" style="background:hsl(${hue} 45% 32%)">${esc(name.trim().charAt(0).toUpperCase())}</div>`;
  const links = (cfg.links || []).filter(l => l && l.url)
    .map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a>`).join("");

  $("#app").innerHTML = `
    <a class="back" href="#leaderboard">← Leaderboard</a>
    <div class="card profile-head">
      ${avatar}
      <div>
        <h1 class="pname">${esc(name)}</h1>
        ${cfg.bio ? `<p class="bio">${esc(cfg.bio)}</p>` : ""}
        ${links ? `<div class="plinks">${links}</div>` : ""}
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span>Leaderboard rank</span><b>${rankPos ? "#" + rankPos : "—"}</b></div>
      <div class="stat"><span>Points</span><b data-count="${round2(p.pts)}">${round2(p.pts)}</b></div>
      <div class="stat"><span>Levels beaten</span><b data-count="${beaten.length}">${beaten.length}</b></div>
      <div class="stat"><span>Hardest</span><b>${beaten.length ? esc(LEVELS[beaten[0].idx].name || "Untitled") : "—"}</b></div>
    </div>

    <div class="section-title">Levels beaten (${beaten.length})</div>
    ${beaten.length
      ? beaten.map(e => levelRow(e.idx,
          e.role === "Verifier" ? `<span class="tag ver">Verifier</span>` : `<span class="tag">Victor</span>`,
          e.video ? `<a href="${esc(e.video)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">video</a> &nbsp; ` : "")).join("")
      : `<div class="empty">No completions yet.</div>`}

    ${p.created.length ? `<div class="section-title">Levels created (${p.created.length})</div>${p.created.map(i => levelRow(i)).join("")}` : ""}
  `;
  document.querySelectorAll(".row[data-open]").forEach(r =>
    r.addEventListener("click", () => openLevel(+r.dataset.open)));
}

/* ---- text pages ---- */
function renderPage(page) {
  const out = []; let open = "";
  const close = () => { if (open) { out.push(`</${open}>`); open = ""; } };
  for (const line of page.body) {
    const num = line.match(/^\d+\.\s+(.*)/);
    const bul = line.startsWith("- ");
    if (num || bul) {
      const tag = num ? "ol" : "ul";
      if (open !== tag) { close(); out.push(`<${tag}>`); open = tag; }
      out.push(`<li>${esc(num ? num[1] : line.slice(2))}</li>`);
    } else {
      close();
      out.push(`<p>${esc(line)}</p>`);
    }
  }
  close();
  $("#app").innerHTML = `<div class="card prose"><h2>${esc(page.title)}</h2>${out.join("")}</div>`;
}

/* ---- home page ---- */
const ICONS = {
  crown:  '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 18h18v2.5H3zM3 7l4.6 4.2L12 4l4.4 7.2L21 7l-2 9.5H5z"/></svg>',
  code:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 5l-4 14"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.4 9.3-8 11-4.6-1.7-8-6-8-11V5z"/></svg>',
  user:   '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4.2"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
};
const bold = (str) => esc(str).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
let clTab = 0;

function changelogHTML() {
  const tab = CHANGELOG[clTab] || { entries: [] };
  if (!tab.entries.length) return `<div class="empty">No changes yet.</div>`;
  return tab.entries.map(e => `<div class="cl-date">${esc(e.date)}</div>
    <ul>${(e.items || []).map(t => `<li>${bold(t)}</li>`).join("")}</ul>`).join("");
}

function renderHome() {
  const stats = buildStats();
  const name = esc(SITE.name);
  $("#app").innerHTML = `
    <div class="home-grid">
      <div class="home-col">
        <div class="hcard welcome">
          <div class="wtext">
            <h1>${esc(HOME.welcome)} <span>${name}</span>!</h1>
            <p>${esc(HOME.text)}</p>
            ${HOME.disclaimer ? `<p class="disc"><b>${esc(HOME.disclaimerLabel)}</b> ${esc(HOME.disclaimer)}</p>` : ""}
          </div>
          <a class="btn" href="#list">${esc(HOME.button)}</a>
        </div>

        <div class="hcard">
          <div class="tabs">
            <h2>${esc(HOME.changelogTitle)}</h2>
            ${CHANGELOG.map((t, i) => `<button class="tab ${i === clTab ? "active" : ""}" data-tab="${i}" type="button">${esc(t.tab)}</button>`).join("")}
          </div>
          <div class="cl-body" id="clbody">${changelogHTML()}</div>
        </div>

        ${PARTNERS.length ? `<div class="hcard">
          <h2>${esc(HOME.partnersTitle)}</h2>
          <div class="sub" style="margin:0">${esc(HOME.partnersText)}</div>
          <div class="partners">
            ${PARTNERS.map(x => {
              const icon = `<div class="pi" style="${x.icon ? `background-image:url('${esc(x.icon)}')` : ""}">${x.icon ? "" : esc((x.name || "?").charAt(0).toUpperCase())}</div>`;
              const body = `${icon}<div><b>${esc(x.name)}</b><small>${esc(x.desc || "")}</small></div>`;
              return x.url ? `<a class="partner" href="${esc(x.url)}" target="_blank" rel="noopener">${body}</a>` : `<div class="partner">${body}</div>`;
            }).join("")}
          </div>
        </div>` : ""}
      </div>

      <aside class="hcard staff">
        <h2>${esc(HOME.staffTitle)}</h2>
        ${STAFF.filter(g => g.names && g.names.length).map(g => `
          <h3>${esc(g.role)}</h3>
          <div class="chips">${g.names.map(n => {
            const inner = `${ICONS[g.icon] || ""}${esc(n)}`;
            return stats[n] ? `<a class="chip" href="${pHref(n)}">${inner}</a>` : `<span class="chip">${inner}</span>`;
          }).join("")}</div>`).join("")}
      </aside>
    </div>`;

  document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
    clTab = +b.dataset.tab;
    document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", +x.dataset.tab === clTab));
    const body = $("#clbody"); body.innerHTML = changelogHTML(); if (!REDUCED) restart(body, "tabin");
  }));
}

/* ---- disclaimer pop-up ---- */
function showDisclaimer() {
  if (!DISCLAIMER.enabled) return;
  const back = document.createElement("div");
  back.className = "modal-back";
  back.innerHTML = `
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dtitle">
      <h2 id="dtitle">${esc(DISCLAIMER.title)}</h2>
      <ol>${DISCLAIMER.items.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      <button type="button">${esc(DISCLAIMER.button)}</button>
    </div>`;
  let closed = false;
  const close = () => {
    if (closed) return; closed = true;
    document.removeEventListener("keydown", onKey);
    back.classList.add("closing");
    setTimeout(() => back.remove(), REDUCED ? 0 : 200);
  };
  const onKey = (e) => { if (e.key === "Escape" || e.key === "Enter") close(); };
  back.querySelector("button").addEventListener("click", close);
  back.addEventListener("click", (e) => { if (e.target === back) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(back);
  back.querySelector("button").focus();
}

/* ---- router ---- */
function route() {
  renderChrome();
  render();
  animatePage();
}
function render() {
  const h = location.hash.replace(/^#/, "");
  if (h === "" || h === "home") return renderHome();
  if (h === "list") return renderList();
  if (h === "leaderboard") return renderLeaderboard();
  if (h.startsWith("player-")) {
    const n = Object.keys(buildStats()).find(k => "player-" + slug(k) === h);
    return renderProfile(n || h.slice(7));
  }
  const page = PAGES.find(p => p.id === h);
  if (page) return renderPage(page);
  renderList();
}
window.addEventListener("hashchange", route);
route();
showDisclaimer();
</script>
